# Database for the backend tests (pytest). Data lives in tmpfs and is gone after "down".
name: cashflow-test

services:
  cashflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: test-superuser
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      CASHFLOW_DB: cashflow
      CASHFLOW_OWNER_PASSWORD: test-owner
      CASHFLOW_APP_PASSWORD: test-app
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - '127.0.0.1:5442:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d cashflow']
      interval: 2s
      timeout: 5s
      retries: 30
